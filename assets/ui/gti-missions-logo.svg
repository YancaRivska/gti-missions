<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img" aria-labelledby="title desc">
  <title id="title">GTI Missions</title>
  <desc id="desc">Logotipo luminoso do universo GTI Missions</desc>
  <defs>
